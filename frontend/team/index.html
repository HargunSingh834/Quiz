<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.6.2/socket.io.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1a1a24;--accent:#7c3aed;--accent2:#06b6d4;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--text:#f0f0f5;--muted:#6b7280;--border:#1f1f2e}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.screen{width:100%;max-width:640px;display:none}.screen.active{display:block}
/* Login */
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3rem;text-align:center}
.login-logo{font-size:3rem;margin-bottom:1.5rem}
.login-box h1{font-size:2rem;font-weight:800;margin-bottom:0.5rem;background:linear-gradient(135deg,#f0f0f5,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-box p{color:var(--muted);margin-bottom:2rem}
input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:0.85rem 1rem;border-radius:10px;font-family:'Syne',sans-serif;font-size:1rem;outline:none;transition:border 0.2s;margin-bottom:1rem}
input:focus{border-color:var(--accent)}
.btn{width:100%;background:var(--accent);color:white;border:none;padding:0.9rem;border-radius:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.2s}
.btn:hover{background:#6d28d9}
.btn:disabled{opacity:0.5;cursor:not-allowed}
/* Waiting */
.waiting-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3rem;text-align:center}
.pulse{width:80px;height:80px;border-radius:50%;background:rgba(124,58,237,0.1);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 2rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,0.4)}50%{box-shadow:0 0 0 20px rgba(124,58,237,0)}}
/* Quiz */
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.quiz-title{font-size:0.85rem;color:var(--muted);font-weight:600}
.timer-ring{position:relative;width:64px;height:64px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke:var(--border);stroke-width:4}
.timer-ring .progress{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke 0.3s}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:1rem;font-weight:700}
.question-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem;margin-bottom:1.5rem}
.q-meta{display:flex;gap:0.75rem;margin-bottom:1rem}
.badge{display:inline-block;padding:0.25rem 0.7rem;border-radius:100px;font-size:0.72rem;font-weight:700;font-family:'Space Mono',monospace}
.badge.purple{background:rgba(124,58,237,0.15);color:#a78bfa}
.badge.cyan{background:rgba(6,182,212,0.15);color:#22d3ee}
.q-text{font-size:1.2rem;font-weight:700;line-height:1.5}
.options{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-top:1.5rem}
.option{background:var(--surface2);border:2px solid var(--border);border-radius:12px;padding:1rem;cursor:pointer;transition:all 0.2s;text-align:left;display:flex;align-items:center;gap:0.75rem;font-family:'Syne',sans-serif;color:var(--text)}
.option:hover:not(:disabled){border-color:var(--accent);background:rgba(124,58,237,0.05)}
.option:disabled{cursor:not-allowed}
.option.selected{border-color:var(--accent);background:rgba(124,58,237,0.1)}
.option.correct{border-color:var(--green);background:rgba(16,185,129,0.1);color:#34d399}
.option.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:#f87171}
.opt-letter{width:32px;height:32px;border-radius:8px;background:rgba(124,58,237,0.2);color:#a78bfa;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0}
.text-answer{display:flex;gap:0.75rem;margin-top:1.5rem}
.text-answer input{margin:0;flex:1}
.text-answer button{width:auto;padding:0.85rem 1.5rem;flex-shrink:0}
/* Result feedback */
.result-card{background:var(--surface);border-radius:16px;padding:2rem;text-align:center;margin-bottom:1.5rem}
.result-icon{font-size:4rem;margin-bottom:1rem}
.result-card h2{font-size:1.5rem;font-weight:800;margin-bottom:0.5rem}
.result-card p{color:var(--muted)}
/* Leaderboard mini */
.mini-lb{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.mini-lb-row{display:flex;align-items:center;gap:1rem;padding:0.75rem 1rem;border-bottom:1px solid var(--border);font-size:0.85rem}
.mini-lb-row:last-child{border:none}
.mini-lb-row.me{background:rgba(124,58,237,0.08);border-left:3px solid var(--accent)}
.rank{font-family:'Space Mono',monospace;font-size:0.8rem;color:var(--muted);width:24px}
.team-score{margin-left:auto;font-family:'Space Mono',monospace;font-weight:700;color:#a78bfa}
/* End screen */
.end-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3rem;text-align:center}
.alert{padding:0.75rem 1rem;border-radius:8px;font-size:0.85rem;margin-bottom:1rem;text-align:left}
.alert.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171}
</style>
</head>
<body>

<!-- Login -->
<div class="screen active" id="screen-login">
  <div class="login-box">
    <div class="login-logo">🎯</div>
    <h1>Team Login</h1>
    <p>Enter your credentials to join the quiz</p>
    <div id="login-alert"></div>
    <input id="login-id" placeholder="Team ID (e.g. team_alpha)" autocomplete="off">
    <input id="login-pass" type="password" placeholder="Password">
    <button class="btn" onclick="doLogin()">Join Quiz →</button>
  </div>
</div>

<!-- Waiting for quiz -->
<div class="screen" id="screen-waiting">
  <div class="waiting-box">
    <div class="pulse">⏳</div>
    <h2 id="wait-title">Waiting for Quiz</h2>
    <p id="wait-name" style="color:var(--muted);margin-top:0.5rem;margin-bottom:1rem"></p>
    <p style="color:var(--muted);font-size:0.9rem">The admin will start the quiz shortly.<br>Please wait at your seat.</p>
    <div style="margin-top:2rem;padding:1rem;background:var(--surface2);border-radius:10px">
      <span id="team-display" style="font-family:'Space Mono',monospace;color:#a78bfa;font-size:0.9rem"></span>
    </div>
  </div>
</div>

<!-- Question -->
<div class="screen" id="screen-question">
  <div class="quiz-header">
    <div>
      <div class="quiz-title" id="quiz-name-header"></div>
      <div style="font-size:0.82rem;color:var(--muted)" id="q-progress"></div>
    </div>
    <div class="timer-ring">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="28"/>
        <circle cx="32" cy="32" r="28" class="progress" id="timer-circle" stroke-dasharray="176" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-num" id="timer-num">—</div>
    </div>
  </div>

  <div class="question-card">
    <div class="q-meta">
      <span class="badge purple" id="q-type-badge">MCQ</span>
      <span class="badge cyan" id="q-points-badge">10 pts</span>
    </div>
    <div class="q-text" id="q-text"></div>

    <div id="options-area"></div>
  </div>

  <div id="score-display" style="text-align:right;font-family:'Space Mono',monospace;color:var(--muted);font-size:0.85rem">
    Score: <span id="my-score" style="color:#a78bfa">0</span>
  </div>
</div>

<!-- Answer feedback -->
<div class="screen" id="screen-result">
  <div class="result-card" id="result-card">
    <div class="result-icon" id="result-icon">🎯</div>
    <h2 id="result-title">Correct!</h2>
    <p id="result-msg"></p>
    <div id="correct-ans" style="margin-top:1rem;padding:0.75rem;background:rgba(16,185,129,0.1);border-radius:8px;font-size:0.9rem;color:#34d399"></div>
  </div>
  <div>
    <p style="font-size:0.8rem;color:var(--muted);margin-bottom:0.75rem;text-align:center">CURRENT LEADERBOARD</p>
    <div class="mini-lb" id="mini-leaderboard"></div>
  </div>
</div>

<!-- Quiz ended -->
<div class="screen" id="screen-end">
  <div class="end-box">
    <div style="font-size:4rem;margin-bottom:1.5rem">🏆</div>
    <h2 style="font-size:2rem;font-weight:800;margin-bottom:0.5rem">Quiz Complete!</h2>
    <p style="color:var(--muted);margin-bottom:2rem">Final Results</p>
    <div style="font-family:'Space Mono',monospace;font-size:3rem;font-weight:700;color:#a78bfa;margin-bottom:0.5rem" id="final-score">0</div>
    <p style="color:var(--muted)">Your Total Score</p>
    <div class="mini-lb" id="final-leaderboard" style="margin-top:2rem;text-align:left"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('team_token');
let socket = null;
let myTeamId = '', myTeamName = '', sessionId = null;
let currentQuestion = null;
let timerInterval = null, timerMax = 30;
let myScore = 0;

// ── Login ─────────────────────────────────────────────
async function doLogin() {
  const tid = document.getElementById('login-id').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!tid || !pass) return;
  const r = await fetch('/api/auth/login', {
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({team_id:tid,password:pass})
  });
  const d = await r.json();
  if (!r.ok) {
    document.getElementById('login-alert').innerHTML = `<div class="alert error">${d.error}</div>`;
    return;
  }
  if (d.isAdmin) {
    document.getElementById('login-alert').innerHTML = `<div class="alert error">Use the Admin Panel for admin login</div>`;
    return;
  }
  token = d.token;
  myTeamId = d.team_id;
  myTeamName = d.team_name;
  localStorage.setItem('team_token', token);
  initApp();
}

async function initApp() {
  if (!token) return;
  try {
    const p = JSON.parse(atob(token.split('.')[1]));
    if (p.exp * 1000 < Date.now()) { localStorage.removeItem('team_token'); return; }
    myTeamId = p.team_id; myTeamName = p.team_name;
  } catch { return; }

  connectSocket();
  showScreen('waiting');
  document.getElementById('team-display').textContent = `Logged in as: ${myTeamName}`;

  // Restore saved score from localStorage
  const savedScore = parseInt(localStorage.getItem(`score_${myTeamId}`) || '0');
  myScore = savedScore;
  const el = document.getElementById('my-score');
  if (el) el.textContent = myScore;

  // Check for active session
  const d = await apiGet('/quiz/active-session');
  if (d.session) {
    sessionId = d.session.id;
    document.getElementById('wait-title').textContent = 'Quiz Ready';
    document.getElementById('wait-name').textContent = d.session.title;
    socket.emit('join_session', sessionId);
    await checkCurrentQuestion();
  }
}

async function checkCurrentQuestion() {
  if (!sessionId) return;
  const d = await apiGet(`/quiz/session/${sessionId}/current-question`);
  if (d.question && d.session.status === 'question_active') {
    if (d.already_answered) {
      showScreen('waiting');
      return;
    }
    currentQuestion = d.question;
    const elapsed = d.elapsed_seconds || 0;
    showQuestion(d.question, elapsed);
  }
}

// ── Socket ────────────────────────────────────────────
function connectSocket() {
  socket = io({auth:{token}});

  socket.on('quiz_started', ({session_id, quiz}) => {
    sessionId = session_id;
    socket.emit('join_session', session_id);
    document.getElementById('wait-title').textContent = 'Quiz Started!';
    document.getElementById('wait-name').textContent = quiz.title;
    showScreen('waiting');
  });

  socket.on('question_started', ({question, session_id, start_time}) => {
    sessionId = session_id;
    currentQuestion = question;
    const elapsed = Math.floor((Date.now() - start_time) / 1000);
    showQuestion(question, elapsed);
    document.getElementById('quiz-name-header').textContent = question.question_text.substring(0,30)+'...';
  });

  socket.on('question_ended', ({question_id, correct_answer, correct_text}) => {
    clearInterval(timerInterval);
    if (currentQuestion && currentQuestion.id === question_id) {
      // Show correct answer on options
      highlightCorrect(correct_answer, correct_text);
    }
  });

  socket.on('leaderboard_update', (data) => {
    updateMiniLeaderboard(data, 'mini-leaderboard');
    updateMiniLeaderboard(data, 'final-leaderboard');
    const me = data.find(t => t.team_id === myTeamId);
    if (me) {
      myScore = me.total_score;
      localStorage.setItem(`score_${myTeamId}`, myScore);
      const el = document.getElementById('my-score');
      if (el) el.textContent = myScore;
    }
  });

  socket.on('quiz_paused', () => { showScreen('waiting'); document.getElementById('wait-title').textContent = 'Quiz Paused'; });
  socket.on('quiz_ended', () => { document.getElementById('final-score').textContent = myScore; showScreen('end'); });
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
}

function showQuestion(q, elapsedSecs=0) {
  showScreen('question');
  currentQuestion = q;
  const remaining = Math.max(0, q.time_limit - elapsedSecs);

  document.getElementById('q-text').textContent = q.question_text;
  document.getElementById('q-type-badge').textContent = {mcq:'MCQ',truefalse:'True/False',text:'Text'}[q.question_type];
  document.getElementById('q-points-badge').textContent = q.points + ' pts';
  document.getElementById('q-progress').textContent = '';

  renderOptions(q);
  startClientTimer(remaining, q.time_limit);
}

function renderOptions(q) {
  const area = document.getElementById('options-area');

  if (q.question_type === 'text') {
    area.innerHTML = `
      <div class="text-answer">
        <input id="text-ans" placeholder="Type your answer..." autocomplete="off">
        <button class="btn" style="width:auto" onclick="submitTextAnswer()">Submit</button>
      </div>`;
    document.getElementById('text-ans').addEventListener('keydown', e => { if(e.key==='Enter') submitTextAnswer(); });
    return;
  }

  if (q.question_type === 'truefalse') {
    area.innerHTML = `
      <div class="options" style="grid-template-columns:1fr 1fr">
        <button class="option" onclick="submitAnswer('A',this)"><div class="opt-letter">T</div>True</button>
        <button class="option" onclick="submitAnswer('B',this)"><div class="opt-letter">F</div>False</button>
      </div>`;
    return;
  }

  const opts = [['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].filter(o=>o[1]);
  area.innerHTML = `<div class="options">${opts.map(([l,text]) => `
    <button class="option" onclick="submitAnswer('${l}',this)">
      <div class="opt-letter">${l}</div>${text}
    </button>`).join('')}</div>`;
}

async function submitAnswer(answer, btn) {
  document.querySelectorAll('.option').forEach(b => { b.disabled = true; });
  btn.classList.add('selected');
  clearInterval(timerInterval);

  const r = await fetch(`/api/quiz/session/${sessionId}/answer`, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({question_id:currentQuestion.id, answer})
  });
  const d = await r.json();

  if (d.is_correct) {
    btn.classList.remove('selected'); btn.classList.add('correct');
  } else {
    btn.classList.remove('selected'); btn.classList.add('wrong');
    // highlight correct
    document.querySelectorAll('.option').forEach((b,i) => {
      const letters = ['A','B','C','D'];
      // we don't know correct here, wait for question_ended event
    });
  }

  showResultFeedback(d.is_correct, d.points_awarded, false);
  if (r.ok) socket.emit('answer_submitted', {session_id: sessionId});
}

async function submitTextAnswer() {
  const ans = document.getElementById('text-ans')?.value?.trim();
  if (!ans) return;
  document.getElementById('text-ans').disabled = true;
  clearInterval(timerInterval);

  const r = await fetch(`/api/quiz/session/${sessionId}/answer`, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({question_id:currentQuestion.id, answer:ans})
  });
  const d = await r.json();
  showResultFeedback(d.is_correct, d.points_awarded, false);
  if (r.ok) socket.emit('answer_submitted', {session_id: sessionId});
}

function showResultFeedback(correct, points, timedOut=false) {
  document.getElementById('result-icon').textContent = timedOut ? '⏱️' : correct ? '✅' : '❌';
  document.getElementById('result-title').textContent = timedOut ? "Time's Up!" : correct ? 'Correct!' : 'Wrong!';
  document.getElementById('result-msg').textContent = timedOut
    ? "You didn't answer in time"
    : correct
    ? `+${points} points${points > (currentQuestion?.points||10) ? ' (speed bonus! 🚀)' : ''}`
    : 'Better luck next time!';
  document.getElementById('result-card').style.borderColor = timedOut
    ? 'rgba(245,158,11,0.3)'
    : correct ? 'rgba(16,185,129,0.4)' : 'rgba(239,68,68,0.3)';
  if (!timedOut) document.getElementById('correct-ans').style.display = 'none';
  showScreen('result');
}

function highlightCorrect(correctAnswer, correctText) {
  // Highlight on question screen if still showing
  if (document.getElementById('screen-question').classList.contains('active')) {
    const letters = ['A','B','C','D'];
    document.querySelectorAll('.option').forEach((btn, i) => {
      btn.disabled = true;
      if (letters[i] === correctAnswer) {
        btn.classList.remove('selected','wrong');
        btn.classList.add('correct');
      }
    });
  }
  // Show on result screen
  const el = document.getElementById('correct-ans');
  if (el) {
    if (correctAnswer === 'TEXT') {
      el.textContent = '✅ Correct answer: ' + correctText;
    } else if (correctAnswer === 'A') {
      el.textContent = '✅ Correct answer: A — True';
    } else if (correctAnswer === 'B' && currentQuestion?.question_type === 'truefalse') {
      el.textContent = '✅ Correct answer: B — False';
    } else {
      el.textContent = '✅ Correct answer: ' + correctAnswer;
    }
    el.style.display = 'block';
  }
  // If on question screen, move to result after short delay
  if (document.getElementById('screen-question').classList.contains('active')) {
    setTimeout(() => {
      showResultFeedback(false, 0, true);
    }, 1200);
  }
}

function startClientTimer(remaining, total) {
  clearInterval(timerInterval);
  timerMax = total;
  const circle = document.getElementById('timer-circle');
  const numEl = document.getElementById('timer-num');
  const circumference = 176;

  function update(r) {
    const frac = r / total;
    circle.style.strokeDashoffset = circumference * (1 - frac);
    circle.style.stroke = r > total * 0.4 ? '#7c3aed' : r > total * 0.2 ? '#f59e0b' : '#ef4444';
    numEl.textContent = r;
  }

  update(remaining);
  timerInterval = setInterval(() => {
    remaining--;
    update(Math.max(0, remaining));
    if (remaining <= 0) {
      clearInterval(timerInterval);
      document.querySelectorAll('.option').forEach(b => b.disabled = true);
    }
  }, 1000);
}

function updateMiniLeaderboard(data, elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = data.slice(0,8).map((t,i) => `
    <div class="mini-lb-row ${t.team_id===myTeamId?'me':''}">
      <div class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)}</div>
      <div>${t.team_name}</div>
      <div class="team-score">${t.total_score}</div>
    </div>`).join('');
}

async function apiGet(path) {
  const r = await fetch('/api'+path, {headers:{'Authorization':'Bearer '+token}});
  return r.json();
}

// Init
if (token) initApp();

document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
